volumes:
  config: {}
  cache: {}
  media:
    external: true
  nextcloud_data:
    external: true

services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    ports:
      - 8096:8096
    networks:
      - proxy
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - config:/config
      - cache:/cache
      - media:/media
      - nextcloud_data:/nextcloud_data
    labels:
      - sablier.enable=true
      - sablier.group=jellyfin

networks:
  proxy:
    external: true
