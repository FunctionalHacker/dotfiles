global:
  scrape_interval: 15s

scrape_configs:
  - job_name: victoriametrics
    static_configs:
      - targets: [victoriametrics:8428]
  - job_name: caddy
    static_configs:
      - targets: [caddy:2019]
  - job_name: crowdsec
    static_configs:
      - targets: [crowdsec:6060]
  - job_name: anubis
    static_configs:
      - targets: [anubis:9090]
  - job_name: sablier
    static_configs:
      - targets: [sablier:10000]
