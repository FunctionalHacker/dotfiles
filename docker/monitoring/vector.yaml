data_dir: /var/lib/vector

sources:
  docker:
    type: docker_logs
  vector_metrics:
    type: internal_metrics

transforms:
  parse_caddy:
    type: 'remap'
    inputs: ['docker']
    source: |
      # Process only Caddy container
      if .container_name != "caddy" {
        abort
      }

      # Parse Caddy's inner structured JSON log
      parsed, err = parse_json(.message)
      if err == null {
        .caddy = parsed
        .caddy_raw = .message

        method = string(parsed.request.method) ?? "UNKNOWN"
        uri = string(parsed.request.uri) ?? "/"
        status = to_string(parsed.status) ?? "000"

        .message = join!([method, uri, "-", status], " ")
        .level = string(parsed.level) ?? "info"
      } else {
        # Fallback to raw string if log line isn't JSON (e.g. container startup logs)
        .message = .message
      }

sinks:
  vlogs:
    type: elasticsearch
    inputs: [parse_caddy]
    endpoints: [http://victorialogs:9428/insert/elasticsearch/]
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    request:
      headers:
        VL-Stream-Fields: source_type,label.com.docker.compose.service
        VL-Time-Field: timestamp
        VL-Msg-Field: message,log
        AccountID: '0'
        ProjectID: '0'
  victoriametrics:
    type: prometheus_remote_write
    endpoint: http://victoriametrics:8428/api/v1/write
    inputs: [vector_metrics]
    healthcheck:
      enabled: false
