data_dir: /var/lib/vector

sources:
  docker:
    type: docker_logs
  vector_metrics:
    type: internal_metrics

transforms:
  docker_parsed:
    type: remap
    inputs: [docker]
    source: |
      if .container_name != "caddy" && .container_name != "crowdsec" {
        abort
      }

      parsed, err = parse_json(.message)

      if err == null {
        .parsed = parsed
        .raw = .message
        .level = string(parsed.level) ?? "info"

        if .container_name == "caddy" {
          if err == null {
            method = string(parsed.request.method) ?? "UNKNOWN"
            uri = string(parsed.request.uri) ?? "/"
            status = to_string(parsed.status) ?? "000"

            .message = join!([method, uri, "-", status], " ")
          }
        }

        if .container_name == "crowdsec" {
          .message = string(parsed.msg) ?? .message
        }
      }

sinks:
  vlogs:
    type: elasticsearch
    inputs: [docker_parsed]
    endpoints: [http://victorialogs:9428/insert/elasticsearch/]
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    request:
      headers:
        VL-Stream-Fields: source_type,label.com.docker.compose.service
        VL-Time-Field: timestamp
        VL-Msg-Field: message,log
        AccountID: '0'
        ProjectID: '0'
  victoriametrics:
    type: prometheus_remote_write
    endpoint: http://victoriametrics:8428/api/v1/write
    inputs: [vector_metrics]
    healthcheck:
      enabled: false
