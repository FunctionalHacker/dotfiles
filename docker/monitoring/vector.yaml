data_dir: /var/lib/vector

sources:
  docker:
    type: docker_logs

sinks:
  victorialogs:
    type: http
    inputs:
      - docker
    uri: >-
      http://victorialogs:9428/insert/jsonline
      ?_stream_fields=host,container_name
      &_msg_field=message
      &_time_field=timestamp
    compression: gzip
    encoding:
      codec: json
    framing:
      method: newline_delimited
    healthcheck:
      enabled: false
