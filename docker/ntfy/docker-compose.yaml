volumes:
  ntfy: {}

services:
  ntfy:
    container_name: ntfy
    image: binwiederhier/ntfy
    command: serve
    restart: unless-stopped
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ntfy:/var/cache/ntfy
    environment:
      NTFY_BASE_URL: https://ntfy.korhonen.cc
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_DATABASE_URL: 'postgresql://ntfy:${POSTGRES_PASS}@postgres/ntfy'
      NTFY_BEHIND_PROXY: true
      NTFY_ENABLE_LOGIN: true
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_WEB_PUSH_EMAIL_ADDRESS: ${WEB_PUSH_EMAIL_ADDRESS}
      NTFY_WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY}
      NTFY_WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY}
    networks:
      - proxy
      - postgres
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy:
    external: true
  postgres:
    external: true
