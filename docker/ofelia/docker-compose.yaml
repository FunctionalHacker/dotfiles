services:
  ofelia:
    image: mcuadros/ofelia
    container_name: ofelia
    restart: unless-stopped
    networks:
      - msmtpd
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker

networks:
  msmtpd:
    external: true
