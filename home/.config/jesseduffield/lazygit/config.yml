git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - command: difft --color=always --display inline
      type: extDiff
os:
  edit: fhackeditor
promptToReturnFromSubprocess: no
